name: Rama Edit · Pacchetto Microsoft Store

on:
  workflow_dispatch:
    inputs:
      identity_name:
        description: "Package/Identity/Name assegnato da Partner Center"
        required: true
        type: string
      publisher:
        description: "Package/Identity/Publisher assegnato da Partner Center (CN=...)"
        required: true
        type: string
      publisher_display_name:
        description: "Nome pubblico dell’autore approvato da Microsoft"
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Verifica motore e protocollo seriale
        run: dotnet run --project native/RamaEdit.Core.Tests -c Release
      - name: Compila applicazione autonoma Windows
        run: dotnet publish native/RamaEdit.Windows -c Release -r win-x64 --self-contained true -o native/artifacts/win-x64
      - name: Prepara MSIX con identità assegnata da Microsoft
        shell: pwsh
        env:
          STORE_IDENTITY_NAME: ${{ inputs.identity_name }}
          STORE_PUBLISHER: ${{ inputs.publisher }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name }}
        run: |
          & "native/store/Build-StorePackage.ps1" -IdentityName $env:STORE_IDENTITY_NAME -Publisher $env:STORE_PUBLISHER -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME
      - uses: actions/upload-artifact@v4
        with:
          name: RamaEdit-da-caricare-in-Partner-Center
          path: native/artifacts/store/
      - name: Passaggio di certificazione
        shell: pwsh
        run: |
          "## Pacchetto per Partner Center" >> $env:GITHUB_STEP_SUMMARY
          "Questo MSIX è da inviare alla certificazione Microsoft Store. Non è un nuovo installer firmato da scaricare e avviare direttamente. Registrazione, verifica dell’autore e approvazione Store restano necessarie." >> $env:GITHUB_STEP_SUMMARY
